{% extends "base.html" %}
{% block title %}Book a session | {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="page-hero">
  <div class="mesh" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span></div>
  <div class="wrap">
    <p class="eyebrow in-up u1"><span class="dot"></span> Counselling</p>
    <h1 class="in-up u2">Book a counselling session.</h1>
    <p class="lead in-up u3">Online booking is opening soon. Until then, email us and we will arrange a time with you.</p>
    <p class="in-up u4"><a class="btn btn-amber" href="mailto:{{ CONTACT_EMAIL }}?subject=Counselling%20session">Email {{ CONTACT_EMAIL }}</a></p>
  </div>
</section>
{% endblock %}
